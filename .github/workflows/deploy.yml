name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time; a newer push cancels an older run still in progress.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Repo variables. SITE_ENV=production builds for the domain root; anything else builds the
      # /portfolio-preview version.
      SITE_ENV: ${{ vars.SITE_ENV || 'preview' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://ops.dappergentsocks.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Matches the server layout: each deploy goes to releases/<UTC time>-<sha>, then the
      # `current` symlink (Caddy's root) is swapped atomically. The newest 5 releases are kept.
      - name: Upload release and switch current
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          if [ "$SITE_ENV" = "production" ]; then base=/srv/portfolio; else base=/srv/portfolio-preview; fi
          release="$base/releases/$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          ssh_cmd="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          $ssh_cmd "$USER@$HOST" "mkdir -p '$release'"
          rsync -az -e "$ssh_cmd" out/ "$USER@$HOST:$release/"
          $ssh_cmd "$USER@$HOST" "ln -sfn '$release' '$base/current.tmp' && mv -Tf '$base/current.tmp' '$base/current' && cd '$base/releases' && ls -1 | sort -r | tail -n +6 | xargs -r rm -rf --"
