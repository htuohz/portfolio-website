name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time; a newer push cancels an older run still in progress.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Repo variables. SITE_ENV=production builds for the domain root; anything else builds the
      # /portfolio-preview version.
      SITE_ENV: ${{ vars.SITE_ENV || 'preview' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://ops.dappergentsocks.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload with rsync
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          if [ "$SITE_ENV" = "production" ]; then target=/var/www/portfolio/; else target=/var/www/portfolio-preview/; fi
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            out/ "$USER@$HOST:$target"
